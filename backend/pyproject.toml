[project]
name = "ai-knowledge-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "apscheduler>=3.11,<4"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Editable installs run from this checkout; data/ and migrations/ are not Python packages.
[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false
